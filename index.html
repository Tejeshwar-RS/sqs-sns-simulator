<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQS + SNS Simulator</title>
  <meta name="description" content="A browser-based simulator of Amazon SQS and Amazon SNS with live message flow, dead-letter queues and filter policies.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121c2b'/%3E%3Ccircle cx='9' cy='16' r='3.5' fill='%23a58bff'/%3E%3Ccircle cx='23' cy='9' r='3.5' fill='%23ffb74d'/%3E%3Ccircle cx='23' cy='23' r='3.5' fill='%234fd18b'/%3E%3Cpath d='M12 15L20 10M12 17L20 22' stroke='%23fff' stroke-width='1.5' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/flow">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-text"><strong>SQS + SNS Simulator</strong><small>Queues and topics, running in your browser</small></span>
    </a>
    <div class="timebar" role="group" aria-label="Simulated clock controls">
      <div class="clock"><span class="clock-label">Simulated time</span><span id="clock" class="clock-time">--</span></div>
      <div class="seg dark" role="group" aria-label="Clock speed">
        <button data-act="speed" data-v="1" aria-pressed="true">1x</button>
        <button data-act="speed" data-v="10" aria-pressed="false">10x</button>
        <button data-act="speed" data-v="60" aria-pressed="false">60x</button>
      </div>
      <button class="btn btn-dark btn-sm" data-act="pause" aria-pressed="false">Pause</button>
      <div class="seg dark" role="group" aria-label="Jump forward">
        <button data-act="skip" data-ms="10000" title="Jump the clock forward 10 seconds">+10s</button>
        <button data-act="skip" data-ms="60000" title="Jump the clock forward 1 minute">+1m</button>
        <button data-act="skip" data-ms="3600000" title="Jump the clock forward 1 hour">+1h</button>
        <button data-act="skip" data-ms="86400000" title="Jump the clock forward 1 day">+1d</button>
      </div>
      <button class="btn btn-dark btn-sm" data-act="reset">Reset all</button>
    </div>
  </header>

  <div id="demo-banner" class="demo-banner" hidden></div>

  <div class="shell">
    <nav class="side" aria-label="Main">
      <a href="#/flow" data-nav="flow">Message flow</a>
      <a href="#/queues" data-nav="queues">SQS queues <span class="count" id="nav-q">0</span></a>
      <a href="#/topics" data-nav="topics">SNS topics <span class="count" id="nav-t">0</span></a>
      <a href="#/activity" data-nav="activity">Activity log</a>
      <a href="#/learn" data-nav="learn">How it works</a>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/engine.js"></script>
  <script src="js/flow.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
